    <text x="52" y="215" fill="#c5d5e3" font-size="22">AI engineering. Green software. Robotics.</text>
    <text x="52" y="276" fill="#9fb6c9" font-size="15" letter-spacing="1.5">NYU ABU DHABI</text>
    <text x="52" y="307" fill="#c5d5e3" font-size="19" letter-spacing=".4">Computer Science &amp; Applied Mathematics</text>
    <text x="52" y="333" fill="#9fb6c9" font-size="12" letter-spacing="1">BS COMPUTER SCIENCE · APPLIED MATHEMATICS MINOR · 2027</text>
