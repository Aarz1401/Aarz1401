<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Aadil Chasmawala</title>
  <desc id="desc">AI engineering, green software research and robotics. Computer Science and Applied Mathematics at NYU Abu Dhabi. Animated teal circuit paths on dark navy.</desc>
  <style>
    .signal { stroke-dasharray: 18 420; animation: flow 7s linear infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -876; } }
    @keyframes pulse { 50% { opacity: .35; transform: scale(1.45); } }
    @media (prefers-reduced-motion: reduce) { .signal, .halo { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091525"/><stop offset="1" stop-color="#102b38"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#249dba"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ad9d1" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M40 42H1160" stroke="#33515e" stroke-width="1"/>
  <rect x="40" y="40" width="76" height="4" rx="2" fill="url(#accent)"/>
